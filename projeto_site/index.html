<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - nosso projeto</title>
    <style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding-top:50px;
}

.container{
    width:500px;

    background:#e9e9e9;

    border:1px solid #bfbfbf;
    border-radius:10px;

    padding:15px;
}

h2{
    color:#0066cc;

    font-size:18px;

    margin-bottom:15px;
}

form{
    display:flex;
    flex-direction:column;

    gap:5px;
}

label{
    font-size:12px;
    font-weight:bold;
}

input,
textarea{
    width:100%;

    padding:5px;

    border:1px solid #888;
    border-radius: 5px;

    box-sizing:border-box;
}

textarea{
    height:70px;
}

button{
    margin-top:10px;

    padding:6px;

    border:1px solid #888;
    border-radius: 5px;

    background:#dcdcdc;

    cursor:pointer;
}

</style>
</head>
<body>

<div class="container">

    <h2>Fale conosco</h2>

    <form action="processa.php" method="POST">

        <label>Nome:</label>
        <input type="text" name="nome">

        <label>E-mail:</label>
        <input type="email" name="email">

        <label>Mensagem:</label>
        <textarea name="mensagem"></textarea>

        <button type="submit">
            Enviar Dados
        </button>

    </form>

</div>

</body>
</html>
